name: Deploy to Contabo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Version Stamp
        run: echo "${{ github.sha }}" > version.txt

      - name: Set lowercase repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:latest
          provenance: false

      - name: Deploy to Contabo Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ env.REPO_LC }}:latest
            
            docker stop podcast-assistant || true
            docker rm podcast-assistant || true
            
            docker run -d \
              --name podcast-assistant \
              --restart unless-stopped \
              -p 7860:7860 \
              -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
              ghcr.io/${{ env.REPO_LC }}:latest