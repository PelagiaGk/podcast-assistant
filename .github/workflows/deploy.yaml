name: Deploy to Contabo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Using the format and lowercase functions to safely force the tag name to lowercase
          tags: ghcr.io/${{ theme.string.to_lower(github.repository) }}:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Convert repo name to lowercase manually here for the server commands
            REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Pull the new image
            docker pull ghcr.io/$REPO_NAME:latest
            
            # Stop and remove the old container if it exists
            docker stop pyannote-app || true
            docker rm pyannote-app || true
            
            # Run the new container, passing in the server's local .env file
            docker run -d \
              --name pyannote-app \
              -p 7860:7860 \
              --env-file /root/.env \
              ghcr.io/$REPO_NAME:latest